name: Reproduce analyses
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/reproduce.py --with-replication
      - run: python -m scripts.build_results --check
      - run: python -m validation.repository
      - run: git diff --exit-code -- README.md docs/results.md docs/extension_results.md docs/manuscript_integration.md docs/replication_results.md analyses/timing/results.md analyses/timing/reporting.md figures/README.md
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages("survey", repos="https://cloud.r-project.org")'
      - run: Rscript validation/r_survey/reproduce.R
      - run: Rscript analyses/replication/verify.R
      # Data and generated artifacts stay on the temporary runner.
